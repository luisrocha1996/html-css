<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            width: 400px;
            border-collapse: collapse;
            text-align: center;

        }

         th, td {
            border: 1px solid black;
        }

        th {
            background-color: rgb(171, 170, 170);
            color: white;
        }

        .left {
            text-align: left;
        
        }

        .bold {
            font-weight: bold;
        }


    </style>
</head>
<body>
    <h1>Nova Tabela</h1>
    <table>

        <thead>
        <tr>
            <th rowspan="2" scope="row">Área</th>
            <th rowspan="2">Disciplica</th>
            <th colspan="2">Notas</th>
            <th rowspan="2">Média</th>
        </tr>

        <tr>
            <th>Nota 1</th>
            <th>Nota 2</th>
        </tr>
       </thead>

       <tbody>
        <tr>
            <td rowspan="4" scope ="row" class="bold">Exatas</td>
            <td class="left">Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <td class="left">Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

         <tr>
            <td class="left">Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
         <tr>
            <td class="left">Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <th colspan="4" scope ="row" class="left">Média de exatas</th>
            <th>Mèdia</th>
        </tr>

        <tr>
            <td  rowspan= "2" class="bold" class="bold">Humanas</td>
            <td class="left">História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td> 
        </tr>

        <tr>
            <td class="left">Geográfia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>         
        </tr>

        <tr>
            <th colspan="4" scope ="row" class="left">Média de Humanas</th>
            <th>0.0</th>
        </tr>
       </tbody>
    </table>
</body>
</html>
