<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo e Formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <Fieldset>
            <LEgend>Dados Pessoais</LEgend>
        <p>
            <label for="inome">Nome</label>
            <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
        </p>
        <p>
            <label for="E-mail">E-mail</label>
            <input type="email" name="email" id="E-mail"  autocomplete="email" required>
        </p>

        <p>
    
            <label for="itel">Telefone</label>
            <input type="tel" name="tel" id="itel" autocomplete="tel" required pattern="[0-9]{9}">
        </p>
        <p>
            <input type="submit" value="Envar">
            <input type="reset" value="Limpar">
        </p>
</Fieldset>

    </form>
</body>
</html>
